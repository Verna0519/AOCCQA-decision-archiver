<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg    { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; }
      .title { fill:#0f172a; font-size:22px; font-weight:700; }
      .sub   { fill:#64748b; font-size:12px; }
      .box   { rx:10; ry:10; stroke-width:1.5; }
      .in    { fill:#eef2ff; stroke:#6366f1; }
      .gate  { fill:#fff7ed; stroke:#f59e0b; }
      .proc  { fill:#ecfeff; stroke:#06b6d4; }
      .onot  { fill:#f0fdf4; stroke:#22c55e; }
      .ojson { fill:#faf5ff; stroke:#a855f7; }
      .rej   { fill:#fef2f2; stroke:#ef4444; }
      .term  { fill:#f1f5f9; stroke:#64748b; }
      .h     { fill:#0f172a; font-size:14px; font-weight:700; }
      .t     { fill:#334155; font-size:12px; }
      .lbl   { fill:#475569; font-size:12px; font-style:italic; }
      .edge  { stroke:#475569; stroke-width:1.6; fill:none; }
      .flow  { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      text   { text-anchor:middle; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="1078" rx="14"/>

  <!-- Title -->
  <text class="title" x="480" y="40">AOCCQA Decision Archiver ─ 架構流程</text>
  <text class="sub"   x="480" y="60">上游已確認素材 → 四道閘門 → 兩條歸檔路徑（Notion／JSON KB）</text>

  <!-- Inputs -->
  <g>
    <rect class="box in" x="30"  y="78" width="290" height="74"/>
    <text class="h" x="175" y="102">上游輸入 ①</text>
    <text class="t" x="175" y="122">fsd-parser 六段報告</text>
    <text class="t" x="175" y="140">+ Gate 1 澄清結論</text>

    <rect class="box in" x="335" y="78" width="290" height="74"/>
    <text class="h" x="480" y="102">上游輸入 ②</text>
    <text class="t" x="480" y="122">quality-reviewer</text>
    <text class="t" x="480" y="140">確認的行為定義</text>

    <rect class="box in" x="640" y="78" width="290" height="74"/>
    <text class="h" x="785" y="102">上游輸入 ③（可選）</text>
    <text class="t" x="785" y="122">rule-loader</text>
    <text class="t" x="785" y="140">Rule Context</text>
  </g>

  <path class="flow" d="M175,152 L420,176"/>
  <path class="flow" d="M480,152 L480,176"/>
  <path class="flow" d="M785,152 L540,176"/>

  <!-- Gate 1 -->
  <rect class="box gate" x="265" y="178" width="430" height="50"/>
  <text class="h" x="480" y="209">Gate 1 ─ 內容就緒且已確認</text>
  <path class="flow" d="M480,228 L480,246"/>

  <!-- Gate 2 (decision) -->
  <polygon class="gate box" points="480,246 650,302 480,358 310,302" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h" x="480" y="298">Gate 2</text>
  <text class="t" x="480" y="318">archive-worthiness？</text>

  <!-- reject branch -->
  <path class="flow" d="M650,302 L706,302"/>
  <text class="lbl" x="676" y="292">否</text>
  <rect class="box rej" x="708" y="276" width="224" height="52"/>
  <text class="h" x="820" y="299">不歸檔 / 略過</text>
  <text class="t" x="820" y="317">（未確認、待釐清亦不寫入）</text>

  <path class="flow" d="M480,358 L480,400"/>
  <text class="lbl" x="494" y="382">是</text>

  <!-- Gate 3 -->
  <rect class="box gate" x="245" y="400" width="470" height="52"/>
  <text class="h" x="480" y="424">Gate 3 ─ 自動分類</text>
  <text class="t" x="480" y="442">指派目的檔 + category（QA 可覆寫）</text>
  <path class="flow" d="M480,452 L480,494"/>

  <!-- Draft (preview only) -->
  <rect class="box proc" x="250" y="494" width="460" height="66"/>
  <text class="h" x="480" y="520">產草稿 → 對話中預覽（不落地檔案）</text>
  <text class="t" x="480" y="540">Notion 頁草稿 + glossary/KB JSON 條目</text>
  <text class="t" x="480" y="554">先給 QA 看，取得內容確認前不寫任何檔</text>
  <path class="flow" d="M480,560 L480,578"/>

  <!-- Gate 4 (decision) -->
  <polygon class="gate box" points="480,578 650,638 480,698 310,638" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h" x="480" y="632">Gate 4</text>
  <text class="t" x="480" y="652">QA 內容確認？</text>

  <!-- loop back on reject -->
  <path class="flow" d="M310,638 L160,638 L160,527 L250,527"/>
  <text class="lbl" x="188" y="600">退回修改</text>

  <!-- confirm split to two outputs -->
  <path class="flow" d="M420,684 L270,740"/>
  <path class="flow" d="M540,684 L690,740"/>
  <text class="lbl" x="480" y="716">確認 → 落地成品</text>

  <!-- Output: Notion -->
  <rect class="box onot" x="85" y="742" width="370" height="70"/>
  <text class="h" x="270" y="766">落地 ─ notion_pages/*.md</text>
  <text class="t" x="270" y="786">{[市場]_Feature}_{YYYYMMDD}.md</text>
  <text class="t" x="270" y="802">不含 &lt;!-- --&gt; 註解，Notion 匯入友善</text>

  <!-- Output: JSON KB -->
  <rect class="box ojson" x="505" y="742" width="370" height="70"/>
  <text class="h" x="690" y="766">落地 ─ glossary / KB JSON 條目</text>
  <text class="t" x="690" y="786">terms / relations / system_relations …</text>
  <text class="t" x="690" y="802">逐檔 New / Update + 計數增量</text>

  <path class="flow" d="M270,812 L270,854"/>
  <path class="flow" d="M690,812 L690,854"/>

  <!-- Publish: Notion -->
  <rect class="box onot" x="85" y="854" width="370" height="98"/>
  <text class="h" x="270" y="878">Notion 發布（擇一）</text>
  <text class="t" x="270" y="898">① GitHub → Notion 同步</text>
  <text class="t" x="270" y="916">② API + Token（notion_publish.py）</text>
  <text class="t" x="270" y="934">③ Notion connector　④ 手動匯入</text>

  <!-- Merge: Repo -->
  <rect class="box ojson" x="505" y="854" width="370" height="98"/>
  <text class="h" x="690" y="878">Repo 合併（人工）</text>
  <text class="t" x="690" y="898">validate_entries.py 驗證</text>
  <text class="t" x="690" y="916">→ branch → PR → review → merge main</text>
  <text class="t" x="690" y="934">→ 隊友 git pull／重裝 .skill</text>

  <path class="flow" d="M270,952 L420,990"/>
  <path class="flow" d="M690,952 L540,990"/>

  <!-- Notify -->
  <rect class="box term" x="220" y="990" width="520" height="62"/>
  <text class="h" x="480" y="1016">Output 6 ─ 同步與通知提示（每輪必做）</text>
  <text class="t" x="480" y="1036">提醒隊友 pull／maintainer 重建 .skill；repo = 單一真相</text>
</svg>
