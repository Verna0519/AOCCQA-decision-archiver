<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1110" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg    { fill:#ffffff; stroke:#e2e8f0; stroke-width:1; }
      .title { fill:#0f172a; font-size:22px; font-weight:700; }
      .sub   { fill:#64748b; font-size:12px; }
      .box   { rx:10; ry:10; stroke-width:1.5; }
      .in    { fill:#eef2ff; stroke:#6366f1; }
      .gate  { fill:#fff7ed; stroke:#f59e0b; }
      .proc  { fill:#ecfeff; stroke:#06b6d4; }
      .onot  { fill:#f0fdf4; stroke:#22c55e; }
      .okb   { fill:#faf5ff; stroke:#a855f7; }
      .rej   { fill:#fef2f2; stroke:#ef4444; }
      .term  { fill:#f1f5f9; stroke:#64748b; }
      .h     { fill:#0f172a; font-size:14px; font-weight:700; }
      .t     { fill:#334155; font-size:11.5px; }
      .lbl   { fill:#475569; font-size:12px; font-style:italic; }
      .flow  { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      text   { text-anchor:middle; }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="978" height="1108" rx="14"/>

  <text class="title" x="490" y="40">AOCCQA Decision Archiver ─ 架構流程</text>
  <text class="sub"   x="490" y="60">專案收尾彙整（含中途已確認問答）→ 五道閘門（先挑選、再確認）→ 直接寫入 KB／Notion</text>

  <!-- Inputs -->
  <rect class="box in" x="30"  y="78" width="290" height="74"/>
  <text class="h" x="175" y="102">上游輸入 ①</text>
  <text class="t" x="175" y="122">fsd-parser 六段報告</text>
  <text class="t" x="175" y="140">+ Gate 1 澄清結論</text>

  <rect class="box in" x="345" y="78" width="290" height="74"/>
  <text class="h" x="490" y="102">上游輸入 ②</text>
  <text class="t" x="490" y="122">專案中途已定案的</text>
  <text class="t" x="490" y="140">澄清問答／討論結論</text>

  <rect class="box in" x="660" y="78" width="290" height="74"/>
  <text class="h" x="805" y="102">上游輸入 ③</text>
  <text class="t" x="805" y="122">reviewer 確認定義</text>
  <text class="t" x="805" y="140">（＋可選 rule-loader）</text>

  <path class="flow" d="M175,152 L430,176"/>
  <path class="flow" d="M490,152 L490,176"/>
  <path class="flow" d="M805,152 L550,176"/>

  <!-- Gate 1 -->
  <rect class="box gate" x="270" y="176" width="440" height="48"/>
  <text class="h" x="490" y="205">Gate 1 ─ 內容就緒且已確認（未定案不算）</text>
  <path class="flow" d="M490,224 L490,236"/>

  <!-- Gate 2 -->
  <polygon class="box" points="490,236 650,290 490,344 330,290" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h" x="490" y="286">Gate 2</text>
  <text class="t" x="490" y="305">archive-worthiness？</text>
  <path class="flow" d="M650,290 L712,290"/>
  <text class="lbl" x="681" y="281">否</text>
  <rect class="box rej" x="712" y="264" width="238" height="52"/>
  <text class="h" x="831" y="287">不歸檔 / 略過</text>
  <text class="t" x="831" y="305">（含中途未定案問答）</text>
  <path class="flow" d="M490,344 L490,388"/>
  <text class="lbl" x="504" y="370">是</text>

  <!-- Gate 3 -->
  <rect class="box gate" x="255" y="388" width="470" height="48"/>
  <text class="h" x="490" y="417">Gate 3 ─ 自動分類（目的檔 + category，QA 可覆寫）</text>
  <path class="flow" d="M490,436 L490,470"/>

  <!-- Gate 4 selection -->
  <rect class="box gate" x="255" y="470" width="470" height="58"/>
  <text class="h" x="490" y="493">Gate 4 ─ 挑選（勾選這輪要進 KB 的條目）</text>
  <text class="t" x="490" y="514">只有「已確認」者可選；依需要取捨</text>
  <path class="flow" d="M490,528 L490,560"/>

  <!-- Draft preview -->
  <rect class="box proc" x="255" y="560" width="470" height="58"/>
  <text class="h" x="490" y="583">草稿預覽（選中條目，不落地檔案）</text>
  <text class="t" x="490" y="604">Notion 頁草稿 + KB JSON 條目，先給你看</text>
  <path class="flow" d="M490,618 L490,632"/>

  <!-- Gate 5 confirm -->
  <polygon class="box" points="490,632 660,690 490,748 320,690" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h" x="490" y="686">Gate 5</text>
  <text class="t" x="490" y="705">QA 內容確認？</text>

  <!-- loop back -->
  <path class="flow" d="M320,690 L165,690 L165,589 L255,589"/>
  <text class="lbl" x="120" y="645">退回修改</text>

  <!-- confirm split -->
  <path class="flow" d="M430,730 L260,792"/>
  <path class="flow" d="M550,730 L720,792"/>
  <text class="lbl" x="490" y="768">確認 → 落地</text>

  <!-- Output notion -->
  <rect class="box onot" x="70" y="792" width="380" height="64"/>
  <text class="h" x="260" y="816">落地 ─ notion_pages/*.md</text>
  <text class="t" x="260" y="836">{[市場]_Feature}_{YYYYMMDD}.md，匯入友善</text>

  <!-- Output KB write -->
  <rect class="box okb" x="530" y="792" width="380" height="64"/>
  <text class="h" x="720" y="816">寫入 AOCCQA-Knowledge-Base</text>
  <text class="t" x="720" y="836">merge_into_kb.py：New 追加／Update 就地改（不 commit）</text>

  <path class="flow" d="M260,856 L260,880"/>
  <path class="flow" d="M720,856 L720,880"/>

  <!-- Notion publish -->
  <rect class="box onot" x="70" y="880" width="380" height="98"/>
  <text class="h" x="260" y="904">Notion 發布（擇一）</text>
  <text class="t" x="260" y="924">① GitHub → Notion 同步</text>
  <text class="t" x="260" y="942">② API + Token　③ connector</text>
  <text class="t" x="260" y="960">④ 手動匯入</text>

  <!-- Review & push -->
  <rect class="box okb" x="530" y="880" width="380" height="98"/>
  <text class="h" x="720" y="904">檢視並推送（本 skill 不 commit）</text>
  <text class="t" x="720" y="924">git -C $AOCCQA_KB_PATH diff</text>
  <text class="t" x="720" y="942">→ 自行 commit / push</text>
  <text class="t" x="720" y="960">glossary 另輸出 + 手動合併</text>

  <path class="flow" d="M260,978 L410,1010"/>
  <path class="flow" d="M720,978 L570,1010"/>

  <!-- Notify -->
  <rect class="box term" x="220" y="1010" width="540" height="60"/>
  <text class="h" x="490" y="1036">Output 6 ─ 同步與通知提示（每輪必做）</text>
  <text class="t" x="490" y="1056">提醒隊友 pull／maintainer 重建 .skill；repo = 單一真相</text>
</svg>
